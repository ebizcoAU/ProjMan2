# scripts/mosquitto/mosquitto.dev.conf
# ─────────────────────────────────────────────────────────────────────────────
# Local Mosquitto broker for ProjMan2 development.
# Ported from Nexus's own scripts/mosquitto/mosquitto.dev.conf (../nexus/api) —
# same two-listener shape, same reasoning, ProjMan2-branded.
#
# Two listeners:
#   1883  — plain TCP    — for the Node.js server (src/mqtt/client.js), CLI/test scripts
#   9001  — WebSocket    — for a browser client (Dashboard/Portal/VeriTrade) or the
#                           Flutter app running on a physical device over WiFi
#
# Start:
#   mosquitto -c scripts/mosquitto/mosquitto.dev.conf
#
# Or as a background service (auto-restarts on reboot):
#   brew services start mosquitto   ← uses /opt/homebrew/etc/mosquitto/mosquitto.conf
#   Copy this file there or symlink it.
#
# Verify it's running:
#   lsof -i :1883   (should show mosquitto)
#   lsof -i :9001   (should show mosquitto)
# ─────────────────────────────────────────────────────────────────────────────

# ── Persistence & logging ─────────────────────────────────────────────────────
persistence true
persistence_location /tmp/mosquitto-projman2/

log_dest stdout
log_type all

# ── Listener 1: Plain TCP — the ProjMan2 API server, CLI tools ───────────────
listener 1883
allow_anonymous true

# ── Listener 2: WebSocket — browser clients / a physical device over WiFi ────
# Dashboard/Portal/VeriTrade (browsers) can only speak MQTT over WebSocket.
# Same-machine dev: ws://localhost:9001/mqtt. A physical device on the same WiFi
# needs the Mac's LAN IP instead of localhost (ipconfig getifaddr en0).
listener 9001
protocol websockets
allow_anonymous true
